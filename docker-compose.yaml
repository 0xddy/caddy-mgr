services:
  caddy-mgr:
    image: 0xddy/caddy-mgr:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      PUBLIC_APP_URL: https://${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    volumes:
      - caddy_mgr_data:/app/var
    expose:
      - "3000"

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      caddy-mgr:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_mgr_data:
  caddy_data:
  caddy_config:
